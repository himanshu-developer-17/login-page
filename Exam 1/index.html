<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body class=" d-flex justify-content-center align-items-center">
    <div class="overlay"></div>

    <div class="login-box">

        <h2>Login Form</h2>
        <p class="small-text">
            xxxxxxxxxxxxxxxxxxxxxxxxx
        </p>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Enter Your Email" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Enter Your Password">
            </div>
            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login Now</button>

        </form>
        <div class="or">or</div>
        <div class="social-login d-flex justify-content-center">

            <a href="https://www.google.com/" class="social d-flex justify-content-center align-items-center">
                <i class="ri-google-fill"></i>
            </a>

            <a href="https://www.facebook.com/login/" class="social d-flex justify-content-center align-items-center">
                <i class="ri-facebook-fill"></i>
            </a>

        </div>

        <p class="signup">
            Not a member?
            <a href="#">Signup Now</a>
        </p>


    </div>

</body>

</html>
